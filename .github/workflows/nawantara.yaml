name: Nawantara Nextcloud integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.12.17"
      - run: uv run --no-project --python 3.11 --with httpx==0.28.1 --with cryptography==50.0.2 python -m unittest discover -s backend/nawantara_nextcloud/tests
